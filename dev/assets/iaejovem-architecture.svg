<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do IAeJovem</title>
  <desc id="desc">Diagrama da arquitetura do IAeJovem com atores, RBAC, painéis Next.js, API Routes, Ayla via Abacus AI e camada de dados Prisma com PostgreSQL.</desc>
  <style>
    .bg { fill: #101111; }
    .zone { fill: #151718; stroke: #34393d; stroke-width: 2; }
    .service { fill: #191c1e; stroke: #dedede; stroke-width: 1.5; }
    .gateway { fill: #10151f; stroke: #00d75f; stroke-width: 1.8; }
    .data { fill: #121b16; stroke: #00d75f; stroke-width: 1.5; }
    .ai { fill: #111827; stroke: #60a5fa; stroke-width: 1.8; }
    .risk { fill: #1f1515; stroke: #f87171; stroke-width: 1.5; }
    .headline { fill: #f3f3f0; font: 700 22px "SFMono-Regular", Consolas, monospace; }
    .zone-title { fill: #f3f3f0; font: 700 18px "SFMono-Regular", Consolas, monospace; }
    .node-title { fill: #f3f3f0; font: 700 18px "SFMono-Regular", Consolas, monospace; text-anchor: middle; }
    .node-small { fill: #c8cdd0; font: 13px "SFMono-Regular", Consolas, monospace; text-anchor: middle; }
    .muted { fill: #9ba3aa; font: 13px "SFMono-Regular", Consolas, monospace; }
    .edge-label { fill: #9ba3aa; font: 12px "SFMono-Regular", Consolas, monospace; text-anchor: middle; }
    .green { fill: #00d75f; font: 700 14px "SFMono-Regular", Consolas, monospace; }
    .flow { stroke: #00d75f; stroke-width: 2; fill: none; }
    .line { stroke: #9ba3aa; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .strong-line { stroke: #00d75f; stroke-width: 2; fill: none; marker-end: url(#arrow-green); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#9ba3aa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#00d75f"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="940"/>

  <text class="green" x="56" y="48">$ open iaejovem</text>
  <text class="headline" x="56" y="82">IAeJovem - apoio emocional com privacidade operacional</text>
  <text class="muted" x="56" y="108">Ayla conversa com estudantes enquanto a escola acompanha scores, alertas e auditoria</text>

  <rect class="zone" x="52" y="145" width="1296" height="165"/>
  <text class="zone-title" x="80" y="178">Atores + controle de acesso</text>

  <rect class="service" x="95" y="215" width="220" height="64"/>
  <text class="node-title" x="205" y="242">Aluno</text>
  <text class="node-small" x="205" y="262">chat, pontos e loja</text>

  <rect class="service" x="365" y="215" width="220" height="64"/>
  <text class="node-title" x="475" y="242">Professor</text>
  <text class="node-small" x="475" y="262">turmas e indicadores</text>

  <rect class="service" x="635" y="215" width="220" height="64"/>
  <text class="node-title" x="745" y="242">Admin</text>
  <text class="node-small" x="745" y="262">gestão e auditoria</text>

  <rect class="gateway" x="955" y="215" width="300" height="64"/>
  <text class="node-title" x="1105" y="242">Middleware RBAC</text>
  <text class="node-small" x="1105" y="262">Next.js routing por papel</text>

  <path class="flow" d="M205 279 V296"/>
  <path class="flow" d="M475 279 V296"/>
  <path class="flow" d="M745 279 V296"/>
  <path class="strong-line" d="M205 296 H1105 V279"/>

  <rect class="zone" x="52" y="360" width="1296" height="170"/>
  <text class="zone-title" x="80" y="393">Frontend - Next.js App Router</text>

  <rect class="gateway" x="95" y="430" width="330" height="68"/>
  <text class="node-title" x="260" y="459">Painel do Aluno</text>
  <text class="node-small" x="260" y="479">Ayla, resgates e progresso</text>

  <rect class="gateway" x="535" y="430" width="330" height="68"/>
  <text class="node-title" x="700" y="459">Painel do Professor</text>
  <text class="node-small" x="700" y="479">scores, notas e alertas</text>

  <rect class="gateway" x="975" y="430" width="330" height="68"/>
  <text class="node-title" x="1140" y="459">Painel Admin</text>
  <text class="node-small" x="1140" y="479">dashboards e governança</text>

  <path class="line" d="M1035 279 C930 335 650 348 260 430"/>
  <path class="line" d="M1105 279 C1060 335 850 365 700 430"/>
  <path class="line" d="M1180 279 C1230 335 1220 382 1140 430"/>

  <rect class="zone" x="52" y="580" width="1296" height="220"/>
  <text class="zone-title" x="80" y="613">Backend - API Routes e regras de produto</text>

  <rect class="service" x="95" y="650" width="235" height="64"/>
  <text class="node-title" x="212.5" y="677">NextAuth</text>
  <text class="node-small" x="212.5" y="697">sessão e credenciais</text>

  <rect class="gateway" x="380" y="650" width="235" height="64"/>
  <text class="node-title" x="497.5" y="677">Chat Ayla</text>
  <text class="node-small" x="497.5" y="697">stream e contexto</text>

  <rect class="gateway" x="665" y="650" width="235" height="64"/>
  <text class="node-title" x="782.5" y="677">Gamificação</text>
  <text class="node-small" x="782.5" y="697">pontos e resgates</text>

  <rect class="service" x="950" y="650" width="235" height="64"/>
  <text class="node-title" x="1067.5" y="677">Admin APIs</text>
  <text class="node-small" x="1067.5" y="697">CRUD, bulk e logs</text>

  <rect class="risk" x="520" y="740" width="360" height="48"/>
  <text class="node-title" x="700" y="770">SentimentCalc - score 0 a 10</text>

  <path class="strong-line" d="M260 498 V535 C260 590 420 620 498 650"/>

  <path class="line" d="M260 498 C385 560 700 590 782 650"/>

  <path class="line" d="M700 498 V740"/>

  <path class="line" d="M1140 498 V650"/>

  <path class="line" d="M498 714 C540 735 600 742 650 740"/>

  <rect class="zone" x="52" y="835" width="1296" height="90"/>
  <text class="zone-title" x="80" y="868">IA externa + dados persistidos</text>

  <rect class="ai" x="315" y="875" width="250" height="48"/>
  <text class="node-title" x="440" y="905">Abacus.AI API</text>

  <rect class="data" x="760" y="875" width="360" height="48"/>
  <text class="node-title" x="940" y="905">Prisma ORM + PostgreSQL</text>

  <path class="strong-line" d="M498 714 C465 770 450 825 440 875"/>

  <path class="line" d="M213 714 C285 815 665 845 840 875"/>
  <path class="line" d="M700 788 C740 824 805 850 880 875"/>
  <path class="line" d="M783 714 C818 785 875 835 915 875"/>
  <path class="line" d="M1068 714 C1050 790 1000 835 960 875"/>
</svg>
