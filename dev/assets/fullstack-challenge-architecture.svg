<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do Chrono Crash</title>
  <desc id="desc">Diagrama do Chrono Crash com React e Vite, Kong, Keycloak, Game Service, RabbitMQ, Wallet Service, PostgreSQL, Prometheus, Grafana, Jaeger, OpenTelemetry e quality gates.</desc>
  <style>
    .bg { fill: #101111; }
    .zone { fill: #151718; stroke: #34393d; stroke-width: 2; }
    .service { fill: #191c1e; stroke: #dedede; stroke-width: 1.5; }
    .gateway { fill: #10151f; stroke: #00d75f; stroke-width: 1.8; }
    .queue { fill: #10151f; stroke: #00d75f; stroke-width: 1.8; }
    .data { fill: #121b16; stroke: #00d75f; stroke-width: 1.5; }
    .obs { fill: #17131f; stroke: #9a7cff; stroke-width: 1.5; }
    .headline { fill: #f3f3f0; font: 700 22px "SFMono-Regular", Consolas, monospace; }
    .zone-title { fill: #f3f3f0; font: 700 18px "SFMono-Regular", Consolas, monospace; }
    .node-title { fill: #f3f3f0; font: 700 18px "SFMono-Regular", Consolas, monospace; text-anchor: middle; }
    .node-small { fill: #c8cdd0; font: 13px "SFMono-Regular", Consolas, monospace; text-anchor: middle; }
    .muted { fill: #9ba3aa; font: 13px "SFMono-Regular", Consolas, monospace; }
    .edge-label { fill: #9ba3aa; font: 12px "SFMono-Regular", Consolas, monospace; text-anchor: middle; }
    .green { fill: #00d75f; font: 700 14px "SFMono-Regular", Consolas, monospace; }
    .line { stroke: #9ba3aa; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .strong-line { stroke: #00d75f; stroke-width: 2; fill: none; marker-end: url(#arrow-green); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#9ba3aa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#00d75f"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="940"/>

  <text class="green" x="56" y="48">$ docker compose up --build</text>
  <text class="headline" x="56" y="82">Chrono Crash - Full-stack Crash Game</text>
  <text class="muted" x="56" y="108">arquitetura para consistencia financeira, realtime, auditoria e observabilidade</text>

  <rect class="zone" x="52" y="145" width="1296" height="155"/>
  <text class="zone-title" x="80" y="178">Client + Edge</text>

  <rect class="service" x="88" y="210" width="295" height="64"/>
  <text class="node-title" x="235.5" y="238">React + Vite UI</text>
  <text class="node-small" x="235.5" y="258">Tailwind v4, Zustand</text>

  <rect class="gateway" x="535" y="210" width="290" height="64"/>
  <text class="node-title" x="680" y="238">Kong API Gateway</text>
  <text class="node-small" x="680" y="258">REST e Socket.IO proxy</text>

  <rect class="gateway" x="1010" y="210" width="255" height="64"/>
  <text class="node-title" x="1137.5" y="238">Keycloak</text>
  <text class="node-small" x="1137.5" y="258">OIDC, JWT e JWKS</text>

  <rect class="zone" x="52" y="350" width="1296" height="245"/>
  <text class="zone-title" x="80" y="383">Bounded contexts</text>

  <rect class="service" x="90" y="425" width="330" height="84"/>
  <text class="node-title" x="255" y="456">Game Service</text>
  <text class="node-small" x="255" y="477">NestJS, rounds, bets, cashout</text>
  <text class="node-small" x="255" y="496">provably fair, leaderboard</text>

  <rect class="queue" x="535" y="425" width="330" height="84"/>
  <text class="node-title" x="700" y="456">RabbitMQ</text>
  <text class="node-small" x="700" y="477">wallet.debit / wallet.credit</text>
  <text class="node-small" x="700" y="496">outbox + inbox idempotente</text>

  <rect class="service" x="980" y="425" width="330" height="84"/>
  <text class="node-title" x="1145" y="456">Wallet Service</text>
  <text class="node-small" x="1145" y="477">saldo, ledger e comandos</text>
  <text class="node-small" x="1145" y="496">centavos com BigInt</text>

  <rect class="data" x="125" y="535" width="260" height="52"/>
  <text class="node-title" x="255" y="568">PostgreSQL games</text>

  <rect class="data" x="1015" y="535" width="260" height="52"/>
  <text class="node-title" x="1145" y="568">PostgreSQL wallets</text>

  <rect class="zone" x="52" y="645" width="1296" height="170"/>
  <text class="zone-title" x="80" y="678">Observability + quality gates</text>

  <rect class="obs" x="92" y="715" width="260" height="58"/>
  <text class="node-title" x="222" y="746">Prometheus</text>
  <text class="node-small" x="222" y="765">/metrics por servico</text>

  <rect class="obs" x="410" y="715" width="245" height="58"/>
  <text class="node-title" x="532.5" y="746">Grafana</text>
  <text class="node-small" x="532.5" y="765">dashboards provisionados</text>

  <rect class="obs" x="715" y="715" width="245" height="58"/>
  <text class="node-title" x="837.5" y="746">Jaeger</text>
  <text class="node-small" x="837.5" y="765">traces via OTEL</text>

  <rect class="obs" x="1020" y="715" width="285" height="58"/>
  <text class="node-title" x="1162.5" y="746">Quality Gates</text>
  <text class="node-small" x="1162.5" y="765">Bun, Vitest, Playwright, CI</text>

  <path class="strong-line" d="M383 242 H535"/>
  <text class="edge-label" x="459" y="230">HTTP / WS</text>

  <path class="line" d="M825 242 H1010"/>
  <text class="edge-label" x="917" y="230">login OIDC</text>

  <path class="strong-line" d="M680 274 V417"/>
  <text class="edge-label" x="704" y="345">routes</text>

  <path class="strong-line" d="M420 467 H535"/>
  <text class="edge-label" x="478" y="454">outbox</text>

  <path class="strong-line" d="M865 467 H980"/>
  <text class="edge-label" x="922" y="454">inbox</text>

  <path class="line" d="M255 509 V535"/>
  <path class="line" d="M1145 509 V535"/>

  <path class="line" d="M1137 274 C1080 330 1165 365 1145 425"/>
  <text class="edge-label" x="1175" y="355">Bearer JWT</text>

  <path class="line" d="M255 425 C250 370 230 330 235 274"/>
  <text class="edge-label" x="185" y="338">Socket.IO events</text>

  <path class="line" d="M90 467 C34 560 32 735 92 744"/>
  <path class="line" d="M700 509 C700 635 533 675 533 715"/>
  <path class="line" d="M1310 467 C1340 595 1060 675 838 715"/>

  <text class="green" x="56" y="872">bonus: outbox/inbox, auto cashout, auto bet Martingale, observabilidade, leaderboard, rate limiting e E2E multiaba</text>
</svg>
