name: Deploy cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cpanel-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Pull and deploy on cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CPANEL_API_HOST: ${{ secrets.CPANEL_API_HOST }}
      CPANEL_API_USER: ${{ secrets.CPANEL_API_USER }}
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      CPANEL_API_PORT: ${{ vars.CPANEL_API_PORT || '2083' }}
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
      CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
      CPANEL_REPO_PATH: ${{ vars.CPANEL_REPO_PATH }}
      CPANEL_BRANCH: ${{ vars.CPANEL_BRANCH || 'main' }}
      CPANEL_UAPI_BIN: ${{ vars.CPANEL_UAPI_BIN || '/usr/bin/uapi' }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          api_host="${CPANEL_API_HOST:-${CPANEL_SSH_HOST:-}}"
          api_user="${CPANEL_API_USER:-${CPANEL_SSH_USER:-}}"

          if [ -z "${CPANEL_REPO_PATH:-}" ]; then
            echo "::error::Missing repository variable CPANEL_REPO_PATH"
            missing=1
          fi

          if [ -n "${CPANEL_API_TOKEN:-}" ]; then
            if [ -z "$api_host" ]; then
              echo "::error::Missing repository secret CPANEL_API_HOST, or CPANEL_SSH_HOST as fallback"
              missing=1
            fi

            if [ -z "$api_user" ]; then
              echo "::error::Missing repository secret CPANEL_API_USER, or CPANEL_SSH_USER as fallback"
              missing=1
            fi

            exit "$missing"
          fi

          if [ -z "${CPANEL_SSH_HOST:-}" ]; then
            echo "::error::Missing repository secret CPANEL_SSH_HOST"
            missing=1
          fi

          if [ -z "${CPANEL_SSH_USER:-}" ]; then
            echo "::error::Missing repository secret CPANEL_SSH_USER"
            missing=1
          fi

          if [ -z "${CPANEL_SSH_KEY:-}" ]; then
            echo "::error::Missing repository secret CPANEL_SSH_KEY"
            missing=1
          fi

          exit "$missing"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${CPANEL_API_TOKEN:-}" ]; then
            echo "Using cPanel UAPI token path; SSH key setup skipped."
            exit 0
          fi

          install -m 700 -d ~/.ssh
          key_material="${CPANEL_SSH_KEY//$'\\n'/$'\n'}"
          printf '%s\n' "$key_material" | tr -d '\r' > ~/.ssh/cpanel_deploy_key
          chmod 600 ~/.ssh/cpanel_deploy_key

          if ! grep -q -- "-----BEGIN .* PRIVATE KEY-----" ~/.ssh/cpanel_deploy_key; then
            echo "::error::CPANEL_SSH_KEY must be the private key, including BEGIN/END lines. Do not use the .pub public key here."
            exit 1
          fi

          if ! ssh-keygen -y -f ~/.ssh/cpanel_deploy_key >/dev/null; then
            echo "::error::CPANEL_SSH_KEY is not a valid OpenSSH private key. Recreate the secret with the exact multiline private key."
            exit 1
          fi

          if [ -n "${CPANEL_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${CPANEL_SSH_PORT:-22}" "$CPANEL_SSH_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Pull latest commit and trigger cPanel deployment
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${CPANEL_API_TOKEN:-}" ]; then
            if ! command -v jq >/dev/null; then
              echo "::error::jq is required for cPanel UAPI response validation"
              exit 1
            fi

            api_host="${CPANEL_API_HOST:-${CPANEL_SSH_HOST:-}}"
            api_user="${CPANEL_API_USER:-${CPANEL_SSH_USER:-}}"
            api_port="${CPANEL_API_PORT:-2083}"
            api_base="https://${api_host}:${api_port}/execute"
            branch="${CPANEL_BRANCH:-main}"

            api_call() {
              local endpoint="$1"
              shift

              curl --fail-with-body --silent --show-error --get \
                --header "Authorization: cpanel ${api_user}:${CPANEL_API_TOKEN}" \
                "$@" \
                "${api_base}/${endpoint}"
            }

            assert_uapi_success() {
              local body="$1"
              local label="$2"

              if ! printf '%s' "$body" | jq -e '.result.status == 1' >/dev/null; then
                echo "::error::${label} failed"
                printf '%s\n' "$body" | jq -c '{errors: .result.errors, messages: .result.messages, warnings: .result.warnings}' || printf '%s\n' "$body"
                exit 1
              fi
            }

            echo "Updating cPanel-managed repository via UAPI."
            update_response="$(
              api_call "VersionControl/update" \
                --data-urlencode "repository_root=${CPANEL_REPO_PATH}" \
                --data-urlencode "branch=${branch}"
            )"
            assert_uapi_success "$update_response" "VersionControl/update"

            remote_sha=""
            deployable=""

            for attempt in {1..30}; do
              retrieve_response="$(
                api_call "VersionControl/retrieve" \
                  --data-urlencode "fields=repository_root,branch,last_update,deployable,tasks"
              )"
              assert_uapi_success "$retrieve_response" "VersionControl/retrieve"

              repo_json="$(
                printf '%s' "$retrieve_response" \
                  | jq -c --arg root "$CPANEL_REPO_PATH" '[.result.data[]? | select(.repository_root == $root)][0] // empty'
              )"

              if [ -n "$repo_json" ]; then
                remote_sha="$(printf '%s' "$repo_json" | jq -r '.last_update.identifier // ""')"
                deployable="$(printf '%s' "$repo_json" | jq -r '.deployable // ""')"
              fi

              if [ "$remote_sha" = "$GITHUB_SHA" ]; then
                break
              fi

              echo "Waiting for cPanel repository update (${attempt}/30). Current remote HEAD: ${remote_sha:-unknown}"
              sleep 5
            done

            if [ "$remote_sha" != "$GITHUB_SHA" ]; then
              echo "::error::cPanel repository did not update to $GITHUB_SHA. Last observed HEAD: ${remote_sha:-unknown}"
              exit 1
            fi

            if [ "$deployable" != "1" ]; then
              echo "::error::cPanel repository is not deployable after update"
              exit 1
            fi

            echo "Creating cPanel deployment via UAPI."
            deploy_response="$(
              api_call "VersionControlDeployment/create" \
                --data-urlencode "repository_root=${CPANEL_REPO_PATH}"
            )"
            assert_uapi_success "$deploy_response" "VersionControlDeployment/create"

            deploy_id="$(printf '%s' "$deploy_response" | jq -r '.result.data.deploy_id // empty')"

            if [ -z "$deploy_id" ]; then
              echo "::error::VersionControlDeployment/create did not return a deploy_id"
              exit 1
            fi

            deployment_state=""

            for attempt in {1..60}; do
              deployment_response="$(api_call "VersionControlDeployment/retrieve")"
              assert_uapi_success "$deployment_response" "VersionControlDeployment/retrieve"

              deployment_json="$(
                printf '%s' "$deployment_response" \
                  | jq -c --arg id "$deploy_id" '[.result.data[]? | select((.deploy_id | tostring) == $id)][0] // empty'
              )"

              if [ -n "$deployment_json" ]; then
                if [ "$(printf '%s' "$deployment_json" | jq -r '.timestamps.failed // empty')" ]; then
                  echo "::error::cPanel deployment ${deploy_id} failed"
                  printf '%s\n' "$deployment_json" | jq -c '{deploy_id, log_path, timestamps, repository_state}'
                  exit 1
                fi

                if [ "$(printf '%s' "$deployment_json" | jq -r '.timestamps.canceled // empty')" ]; then
                  echo "::error::cPanel deployment ${deploy_id} was canceled"
                  printf '%s\n' "$deployment_json" | jq -c '{deploy_id, log_path, timestamps, repository_state}'
                  exit 1
                fi

                if [ "$(printf '%s' "$deployment_json" | jq -r '.timestamps.succeeded // empty')" ]; then
                  deployment_state="succeeded"
                  printf '%s\n' "$deployment_json" | jq -c '{deploy_id, log_path, timestamps, repository_state}'
                  break
                fi
              fi

              echo "Waiting for cPanel deployment ${deploy_id} (${attempt}/60)."
              sleep 5
            done

            if [ "$deployment_state" != "succeeded" ]; then
              echo "::error::Timed out waiting for cPanel deployment ${deploy_id}"
              exit 1
            fi

            echo "PAPERCLIP_DEPLOY_REMOTE_OK"
            exit 0
          fi

          printf -v repo_path_q '%q' "$CPANEL_REPO_PATH"
          printf -v branch_q '%q' "${CPANEL_BRANCH:-main}"
          printf -v uapi_bin_q '%q' "${CPANEL_UAPI_BIN:-/usr/bin/uapi}"

          set +e
          remote_output="$(ssh \
            -i ~/.ssh/cpanel_deploy_key \
            -p "${CPANEL_SSH_PORT:-22}" \
            -o IdentitiesOnly=yes \
            -o IdentityAgent=none \
            -o PreferredAuthentications=publickey \
            -o PubkeyAuthentication=yes \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o NumberOfPasswordPrompts=0 \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "CPANEL_REPO_PATH=$repo_path_q CPANEL_BRANCH=$branch_q CPANEL_UAPI_BIN=$uapi_bin_q bash -s" <<'REMOTE'
          set -Eeuo pipefail

          if [ -z "${CPANEL_BRANCH:-}" ]; then
            CPANEL_BRANCH=main
          fi

          if [ -z "${CPANEL_UAPI_BIN:-}" ]; then
            CPANEL_UAPI_BIN=/usr/bin/uapi
          fi

          if [ ! -d "$CPANEL_REPO_PATH/.git" ]; then
            echo "Repository not found at CPANEL_REPO_PATH=$CPANEL_REPO_PATH"
            exit 1
          fi

          if [ ! -x "$CPANEL_UAPI_BIN" ]; then
            if [ -x /usr/local/cpanel/bin/uapi ]; then
              CPANEL_UAPI_BIN=/usr/local/cpanel/bin/uapi
            else
              echo "uapi not found at $CPANEL_UAPI_BIN or /usr/local/cpanel/bin/uapi"
              exit 1
            fi
          fi

          cd "$CPANEL_REPO_PATH"
          git fetch origin "$CPANEL_BRANCH"

          if git show-ref --verify --quiet "refs/heads/$CPANEL_BRANCH"; then
            git checkout "$CPANEL_BRANCH"
          else
            git checkout -B "$CPANEL_BRANCH" "origin/$CPANEL_BRANCH"
          fi

          git pull --ff-only origin "$CPANEL_BRANCH"
          "$CPANEL_UAPI_BIN" VersionControlDeployment create repository_root="$CPANEL_REPO_PATH"
          echo "PAPERCLIP_DEPLOY_REMOTE_OK"
          REMOTE
          )"
          remote_status=$?
          set -e

          printf '%s\n' "$remote_output"

          if printf '%s\n' "$remote_output" | grep -qi "Shell access is not enabled"; then
            echo "::error::cPanel SSH authenticated, but shell access is disabled for this account. Enable shell access or switch this workflow to a cPanel API-token deploy path."
            exit 1
          fi

          if [ "$remote_status" -ne 0 ]; then
            echo "::error::Remote cPanel deploy command failed with exit code $remote_status"
            exit "$remote_status"
          fi

          if ! printf '%s\n' "$remote_output" | grep -q "PAPERCLIP_DEPLOY_REMOTE_OK"; then
            echo "::error::Remote cPanel deploy marker was not found. The SSH login probably did not execute the deploy script."
            exit 1
          fi
